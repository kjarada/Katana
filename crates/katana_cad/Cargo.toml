[package]
name = "katana_cad"
description = "The cad layer: the engine both front ends drive: the document, the command interpreter and every verb family."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# The passes over a drawing, measured (docs/performance.md, "The broad phase's second extent",
# "The verbs' walks", "Global Modify's layers"): a plain program, no benchmark library, so no
# crate is added for it.
[[bench]]
name = "drawing_passes"
harness = false

[dependencies]
katana_commands.workspace = true
katana_core.workspace = true
katana_entity.workspace = true
katana_geodesy.workspace = true
katana_geometry.workspace = true
katana_math.workspace = true
katana_render.workspace = true
katana_storage.workspace = true
katana_survey.workspace = true
katana_terrain.workspace = true

[lints]
workspace = true
