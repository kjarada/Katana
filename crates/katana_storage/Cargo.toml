[package]
name = "katana_storage"
description = "The storage layer: the project database (SQLite, schema 13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Applying a project's contents to the model, measured (docs/performance.md, "Checking a
# project's contents"): a plain program, no benchmark library, so no crate is added for it.
[[bench]]
name = "apply_contents"
harness = false

# A project of 100 000 entities saved and loaded through its database (docs/performance.md, "A
# project saved and loaded"): the same form.
[[bench]]
name = "project_load"
harness = false

[dependencies]
katana_core.workspace = true
katana_entity.workspace = true
katana_geometry.workspace = true
katana_math.workspace = true
katana_survey.workspace = true

[lints]
workspace = true
