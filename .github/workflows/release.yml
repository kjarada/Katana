# Builds Katana for Windows (x86-64, ARM64), Linux (x86-64, ARM64) and macOS
# (Apple silicon), runs the whole test suite on each, proves each
# package and installer starts on its own, signs what can be signed, and
# publishes them as a GitHub release (docs/release.md) together with the
# update assets an installed copy reads to find and fetch the next version.
#
# It runs only when started by hand: Actions > Release > Run workflow. With a
# tag (vX.Y.Z, matching project(Katana VERSION)) it publishes that release;
# without one it builds and tests the packages and publishes nothing.
#
# Each job runs the same commands a person runs on that platform
# (docs/building.md); nothing here is a second way of building.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, vX.Y.Z matching project(Katana VERSION). Empty: build only."
        required: false
        default: ""
      sign:
        description: "Who signs the update manifests. ci: this run (secret UPDATE_SIGNING_KEY). offline: nobody yet; the release stays a draft until tools/update_release_sign.py has signed it."
        type: choice
        options:
          - ci
          - offline
        default: ci
      publish_repo:
        description: "Another repository to publish the release in, owner/name (secret RELEASES_REPO_TOKEN). Empty: this repository."
        required: false
        default: ""

permissions:
  contents: read

# A newer run waits for the running one rather than cancelling it: the
# Windows build is most of an hour, and a cancelled one proves nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# What every run of the producer (tools/update_make_manifest.py) is told about
# an unpacked package, here once so that the rehearsal in each build job and
# the publish job cannot differ (docs/release.md, "Update assets"):
#   UPDATE_SEED            written only where absent: a sample project the
#                          user has worked in is neither overwritten nor
#                          fetched again at every update.
#   UPDATE_EXCLUDE         outside the four folders a manifest may name
#   UPDATE_EXCLUDE_LINUX   (bin share etc lib), so not part of an update: the
#                          licence text beside them and, in the Linux tree,
#                          the certificate bundle in ssl/.
env:
  UPDATE_SEED: "share/katana/samples/*"
  UPDATE_EXCLUDE: "LICENSE"
  UPDATE_EXCLUDE_LINUX: "ssl/*"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
      elsewhere: ${{ steps.version.outputs.elsewhere }}
      sequence: ${{ steps.version.outputs.sequence }}
    steps:
      - uses: actions/checkout@v4
      # One place a version is written: project(Katana VERSION ...). A tag
      # that disagrees with it would publish packages named for another
      # version, so it fails here, before an hour of building.
      - id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH_REPO: ${{ inputs.publish_repo }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}
        run: |
          version=$(sed -n 's/^project(Katana VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version" || { echo "::error::no project(Katana VERSION ...) in CMakeLists.txt"; exit 1; }
          tag="$INPUT_TAG"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match project(Katana VERSION $version); expected v$version"
            exit 1
          fi
          # Where the release is published is where an installed copy looks
          # for the next one, so it is settled here, once: compiled into every
          # program below (KATANA_UPDATE_REPO) and written into every update
          # manifest. This repository unless the run names another.
          repo="${INPUT_PUBLISH_REPO:-$GITHUB_REPOSITORY}"
          if ! printf '%s\n' "$repo" | grep -Eqx '[A-Za-z0-9._-]+/[A-Za-z0-9._-]+'; then
            echo "::error::publish_repo must be owner/name of a GitHub repository"
            exit 1
          fi
          elsewhere=false
          if [ "${repo,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            elsewhere=true
            # Publishing in another repository needs a token that may write
            # there; the run's own cannot. Asked here, before anything is
            # built for a release that could not be created - which is why
            # the token is a secret of the REPOSITORY: this job does not run
            # in the environment `release` and sees none of its secrets. A
            # run without a tag publishes nothing and needs no token.
            if [ -n "$tag" ] && [ "$HAS_RELEASES_TOKEN" != true ]; then
              echo "::error::publish_repo names $repo, but the repository secret RELEASES_REPO_TOKEN (a token that may write that repository's releases) is not set"
              exit 1
            fi
          fi
          # The sequence of every update manifest this run makes
          # (docs/release.md, "Update assets"): the time the run began to
          # build. Read here and not when publishing, so that the Publish job
          # run again by itself publishes the same packages under the same
          # sequence - an installed copy that already has them is then not
          # offered them a second time - while a whole new run, whose
          # packages are new, outranks this one.
          sequence=$(date -u +%s)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "elsewhere=$elsewhere" >> "$GITHUB_OUTPUT"
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "Katana $version${tag:+, publishing $tag in $repo}, sequence $sequence"
      # Every job below configures with KATANA_REQUIRE_UPDATE_KEYS=ON, which
      # refuses the placeholder update keys: a program built with them can
      # never be updated. This is that refusal asked for in the first
      # minute, rather than after each toolchain is installed.
      #
      # cmake/KatanaUpdateKeys.cmake is run as a script, but not bare. It is
      # written for a configure, where the root CMakeLists.txt has set the
      # policies of its minimum CMake before including it; a script starts
      # with none set, and a CMake older than 4.0 - this runner's own is,
      # the build jobs install a newer one - then does not know the file's
      # `if(... IN_LIST ...)`. So a script of two lines states the minimum
      # the root CMakeLists.txt states and includes the file (a relative
      # path: a script's source directory is the one it is run from).
      #
      # Only a refusal the keys file itself states stops the run: CMake
      # reports those as `KatanaUpdateKeys.cmake:<line> (message)`. Anything
      # else - a CMake too old for that minimum, say - is this check failing
      # to run, not the keys failing it, and each job's configure decides.
      - name: Update keys
        run: |
          if ! command -v cmake > /dev/null; then
            echo "::notice::no cmake on this runner: the update keys are first checked by each job's configure"
            exit 0
          fi
          cmake --version | head -1
          script="$RUNNER_TEMP/update-keys.cmake"
          log="$RUNNER_TEMP/update-keys.log"
          printf '%s\n' 'cmake_minimum_required(VERSION 3.24)' 'include(cmake/KatanaUpdateKeys.cmake)' > "$script"
          status=0
          cmake -DKATANA_REQUIRE_UPDATE_KEYS=ON -P "$script" > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -Eq 'KatanaUpdateKeys\.cmake:[0-9]+ \(message\)' "$log"; then
            echo "::error::cmake/KatanaUpdateKeys.cmake does not hold update keys a release can be built with; its own words are above. The owner's key steps: docs/release.md, Update signing."
            exit 1
          fi
          echo "::warning::The update keys could not be checked in this job: cmake stopped for a reason of its own, shown above. Each job's configure checks them."

  windows:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSYS2 UCRT64 and GCC, as on the owner's machine (docs/building.md).
          - name: Windows x86-64
            runner: windows-2025
            msystem: UCRT64
            compiler: g++.exe
            packages: gcc:p nsis:p
            package: win64
            nsis: msys2
          # MSYS2 has no GCC for ARM64; its CLANGARM64 environment is clang
          # and libc++, built for ARM64 Windows.
          - name: Windows ARM64
            runner: windows-11-arm
            msystem: CLANGARM64
            compiler: clang++.exe
            packages: clang:p
            package: win-arm64
            # NSIS's own x86 build, which Windows on ARM runs emulated; the
            # installer it makes installs the ARM64 programs.
            nsis: chocolatey
    env:
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: unzip
          pacboy: >-
            ${{ matrix.packages }} cmake:p ninja:p python:p
            qt6-base:p qt6-tools:p cgal:p eigen3:p boost:p gmp:p mpfr:p
            proj:p gdal:p pdal:p nlohmann-json:p sqlite3:p
      - name: Toolchain
        run: |
          "${{ matrix.compiler }}" --version | head -1
          cmake --version | head -1
      - name: NSIS
        if: matrix.nsis == 'chocolatey'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress }
          if (-not (Test-Path $makensis)) { throw "makensis.exe is not at $makensis after installing NSIS" }
          "KATANA_MAKENSIS=$($makensis -replace '\\','/')" >> $env:GITHUB_ENV
      # The release preset, with the compiler and prefix of the environment
      # the action installed (the preset names C:/msys64/ucrt64, a
      # developer's default). What makes it a RELEASE and not a developer's
      # build: the update keys must be real ones, and the repository an
      # installed copy asks for the next version is the one this run
      # publishes in.
      #
      # Both settings must have reached the project, not only its command
      # line: CMake takes a -D the project has no use for with a warning and
      # builds without it, and no program says which repository it asks. So
      # the cache must hold each as the option the project declares (a -D
      # nothing declares stays there as UNINITIALIZED), and the repository
      # must be on the update library's compile line. Through tr, and grep
      # without -q: on Windows CMake writes these files with CR LF, and this
      # shell runs with pipefail, which a grep leaving early would trip.
      - name: Configure
        env:
          UPDATE_REPO: ${{ needs.version.outputs.repo }}
        run: |
          prefix=$(cygpath -m "$MINGW_PREFIX")
          cmake --preset release \
            -DCMAKE_CXX_COMPILER="$prefix/bin/${{ matrix.compiler }}" -DCMAKE_PREFIX_PATH="$prefix" \
            ${KATANA_MAKENSIS:+-DKATANA_MAKENSIS="$KATANA_MAKENSIS"} \
            -DKATANA_BUILD_TESTS=ON -DKATANA_BUILD_BENCHMARKS=OFF \
            -DKATANA_REQUIRE_UPDATE_KEYS=ON -DKATANA_UPDATE_REPO="$UPDATE_REPO"
          cache=build/release/CMakeCache.txt
          for setting in "KATANA_REQUIRE_UPDATE_KEYS:BOOL=ON" "KATANA_UPDATE_REPO:STRING=$UPDATE_REPO"; do
            tr -d '\r' < "$cache" | grep -xF -- "$setting" || {
              echo "::error::$cache does not hold $setting: the project did not take -D${setting%%:*}, and the programs would be built without it"
              exit 1
            }
          done
          compiled=$(sed -n 's/.*-DKATANA_UPDATE_REPO=[^A-Za-z0-9 ]*\([A-Za-z0-9._/-]*\).*/\1/p' build/release/build.ninja | sort -u)
          if [ "$compiled" != "$UPDATE_REPO" ]; then
            echo "::error::the update library is compiled with KATANA_UPDATE_REPO '$compiled', not '$UPDATE_REPO': the programs would ask another repository for the next version"
            exit 1
          fi
      - name: Build
        run: cmake --build build/release --parallel
      # The whole suite, on the machine the package is for: nothing is
      # packaged from a build with a failing test (docs/testing.md).
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/release --parallel "$(nproc)" --output-on-failure --timeout 900
      # Signing as the publisher (cmake/KatanaSign.cmake) when the repository
      # holds a code-signing certificate: WINDOWS_CERTIFICATE (the .pfx,
      # base64) and WINDOWS_CERTIFICATE_PASSWORD.
      - name: Signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          pacman -S --noconfirm --needed "$MINGW_PACKAGE_PREFIX-osslsigncode"
          echo "$CERTIFICATE" | base64 -d > "$RUNNER_TEMP/katana.pfx"
          echo "KATANA_SIGN_PFX=$(cygpath -m "$RUNNER_TEMP/katana.pfx")" >> "$GITHUB_ENV"
          echo "KATANA_SIGN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Package
        run: cmake --build build/release --target package
      # The zip is what a user downloads: unpacked with nothing of MSYS2 on
      # PATH, the command line must draw and save a drawing, read a CRS from
      # PROJ's database, import through PDAL and GDAL, and the window must
      # build itself headless.
      #
      # It is also what an update is made from, so the producer and the
      # independent recheck run on it here, unsigned and into a scratch
      # folder, before any program has run in the tree: a file the update
      # rules refuse (docs/release.md, "Update assets") then fails the job
      # that built it, in a run without a tag too, and not the publish job
      # hours later.
      #
      # Then the updater itself: the helper must start, verify a known
      # signature and hold real keys, not the placeholders, and the command
      # line must know which release it is - its version, the target the
      # package was named for, and that it is an unpacked archive.
      - name: Smoke test the package
        timeout-minutes: 20
        run: |
          set -eux
          # said <file> <word>: what a program printed holds exactly that
          # word, between white space. Through a file, not a pipe: this shell
          # runs with pipefail, and grep -q leaving early would fail the pipe.
          said() {
            tr -s ' \t\r' '\n' < "$1" > "$1.words"
            grep -qxF -- "$2" "$1.words" || { echo "::error::$1 does not say $2"; return 1; }
          }
          version="${{ needs.version.outputs.version }}"
          package="Katana-$version-${{ matrix.package }}"
          rm -rf smoke && mkdir smoke
          unzip -q "build/release/$package.zip" -d smoke
          root="smoke/$package"
          cp -r samples/site_plan smoke/project
          python tools/update_make_manifest.py --tree "$root" --out smoke/update \
            --version "$version" --target "${{ matrix.package }}" --sequence 1 \
            --seed "$UPDATE_SEED" --exclude "$UPDATE_EXCLUDE"
          python tools/update_verify_release.py smoke/update --allow-unsigned --targets "${{ matrix.package }}"
          export PATH=/c/Windows/System32:/c/Windows:/usr/bin
          "$root/bin/katana_cli.exe" -c "RECT 0,0 30,20" -c "SAVE smoke/rect.katana"
          test -f smoke/rect.katana/project.db
          "$root/bin/katana_cli.exe" -c "INFO samples/gis/terrain.asc" | tee smoke/info.txt
          grep -q "EPSG:32630" smoke/info.txt
          "$root/bin/katana_cli.exe" -c "IMPORT samples/gis/survey_scan.las" -c "IMPORT samples/gis/parcels.geojson"
          "$root/bin/katana_updater.exe" --selftest > smoke/selftest.txt || { cat smoke/selftest.txt; exit 1; }
          cat smoke/selftest.txt
          said smoke/selftest.txt "selftest=ok"
          said smoke/selftest.txt "keys=pinned"
          "$root/bin/katana_cli.exe" -c "UPDATE STATUS" > smoke/status.txt || { cat smoke/status.txt; exit 1; }
          cat smoke/status.txt
          said smoke/status.txt "installed=$version"
          said smoke/status.txt "target=${{ matrix.package }}"
          said smoke/status.txt "kind=archive"
          # /usr/bin's timeout, by path: with PATH cut to the Windows
          # directories, `timeout` is Windows' own TIMEOUT.EXE, a pause.
          QT_QPA_PLATFORM=offscreen /usr/bin/timeout 300 "$root/bin/katana.exe" smoke/project --screenshot smoke/window.png
          test -s smoke/window.png
      # The installer, as a deployment script runs it: silently into a folder
      # of its own, where the installed command line must read a CRS through
      # GDAL and PROJ and must know it is an INSTALLED copy of this target -
      # the installer records its folder under HKCU, which is how the updater
      # tells it from an unpacked zip (include/katana/update/registry.hpp);
      # then its uninstaller, which must remove it. /D takes the rest of the
      # line unquoted, so the folder has no space for Start-Process to quote.
      # `_?=` keeps the uninstaller in place, so -Wait waits for it rather
      # than for the copy of itself it would otherwise start.
      - name: Smoke test the installer
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "build/release/Katana-${{ needs.version.outputs.version }}-${{ matrix.package }}.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "KatanaInstalled"
          $install = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $info = & "$target\bin\katana_cli.exe" -c "INFO samples/gis/terrain.asc" | Out-String
          Write-Output $info
          if ($LASTEXITCODE -ne 0) { throw "the installed katana_cli exited with $LASTEXITCODE" }
          if ($info -notmatch "EPSG:32630") { throw "the installed katana_cli named no CRS" }
          $status = & "$target\bin\katana_cli.exe" -c "UPDATE STATUS" | Out-String
          Write-Output $status
          if ($LASTEXITCODE -ne 0) { throw "UPDATE STATUS in the installed copy exited with $LASTEXITCODE" }
          $words = $status -split '\s+'
          foreach ($word in "kind=installer", "target=${{ matrix.package }}") {
            if ($words -cnotcontains $word) { throw "the installed katana_cli does not say $word" }
          }
          $uninstall = Start-Process -FilePath "$target\Uninstall.exe" -ArgumentList "/S", "_?=$target" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "the uninstaller exited with $($uninstall.ExitCode)" }
          if (Test-Path "$target\bin\katana_cli.exe") { throw "the uninstaller left bin\katana_cli.exe" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.package }}
          path: smoke/window.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: katana-${{ matrix.package }}
          path: |
            build/release/Katana-*-${{ matrix.package }}.zip
            build/release/Katana-*-${{ matrix.package }}.exe
          if-no-files-found: error

  unix:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole suite runs on each before packaging. On the ARM machines
          # that includes every SIMD kernel suite at the scalar and NEON
          # levels on real hardware (elsewhere NEON runs only under qemu); on
          # Apple silicon the gpu. suite proves the Metal renderer against the
          # software one on a real device.
          - name: Linux x86-64
            runner: ubuntu-24.04
            preset: linux-release
            package: linux-x86_64
            archive: tar.gz
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            preset: linux-release
            package: linux-aarch64
            archive: tar.gz
          - name: macOS arm64
            runner: macos-15
            preset: macos-release
            package: macos-arm64
            archive: dmg
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "KATANA_TOOLCHAIN=$HOME/katana-toolchain" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The conda-forge prefix of docs/building.md, "Linux" and "macOS". Its
      # versions are frozen by the script's SNAPSHOT and SPECS, so the script
      # is the whole cache key.
      - uses: actions/cache@v4
        with:
          path: ~/katana-toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/setup_linux_toolchain.py') }}
      - name: Toolchain
        run: |
          python3 tools/setup_linux_toolchain.py
          echo "$KATANA_TOOLCHAIN/bin-tools" >> "$GITHUB_PATH"
          mkdir -p "$KATANA_TOOLCHAIN/bin-tools"
          # Only the build tools on PATH, not the whole prefix: its bin/ also
          # holds a python3 that would shadow the runner's.
          for tool in cmake ctest cpack ninja; do
            ln -sf "$KATANA_TOOLCHAIN/bin/$tool" "$KATANA_TOOLCHAIN/bin-tools/$tool"
          done
      # A release, not a developer's build: real update keys, and the
      # repository this run publishes in as the one an installed copy asks
      # for the next version - and both must have reached the project, in
      # its cache and on the update library's compile line (see the Windows
      # job, whose check this is).
      - name: Configure
        env:
          UPDATE_REPO: ${{ needs.version.outputs.repo }}
        run: |
          cmake --preset ${{ matrix.preset }} -DKATANA_BUILD_TESTS=ON -DKATANA_BUILD_BENCHMARKS=OFF \
            -DKATANA_REQUIRE_UPDATE_KEYS=ON -DKATANA_UPDATE_REPO="$UPDATE_REPO"
          cache=build/${{ matrix.preset }}/CMakeCache.txt
          for setting in "KATANA_REQUIRE_UPDATE_KEYS:BOOL=ON" "KATANA_UPDATE_REPO:STRING=$UPDATE_REPO"; do
            tr -d '\r' < "$cache" | grep -xF -- "$setting" || {
              echo "::error::$cache does not hold $setting: the project did not take -D${setting%%:*}, and the programs would be built without it"
              exit 1
            }
          done
          compiled=$(sed -n 's/.*-DKATANA_UPDATE_REPO=[^A-Za-z0-9 ]*\([A-Za-z0-9._/-]*\).*/\1/p' build/${{ matrix.preset }}/build.ninja | sort -u)
          if [ "$compiled" != "$UPDATE_REPO" ]; then
            echo "::error::the update library is compiled with KATANA_UPDATE_REPO '$compiled', not '$UPDATE_REPO': the programs would ask another repository for the next version"
            exit 1
          fi
      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel
      # What the Linux tests need of the machine and a CI image lacks: the
      # graphics driver's GL and EGL loaders, which the package leaves to the
      # system (docs/release.md), and an X server with Mesa's software Vulkan
      # driver, on which the gpu. suite runs the Vulkan renderer.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libfontconfig1 \
            xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0
      # The whole suite, on the machine the package is for: nothing is
      # packaged from a build with a failing test (docs/testing.md).
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build/${{ matrix.preset }} --parallel "$jobs" --output-on-failure --timeout 900
          else
            ctest --test-dir build/${{ matrix.preset }} --parallel "$jobs" --output-on-failure --timeout 900
          fi
      # A Developer ID for the publisher, when the repository holds one:
      # MACOS_CERTIFICATE (the .p12, base64), MACOS_CERTIFICATE_PASSWORD and
      # MACOS_SIGN_IDENTITY ("Developer ID Application: <name> (<team>)").
      # Imported into a keychain of the run's own (cmake/KatanaSign.cmake).
      - name: Signing identity
        if: runner.os == 'macOS' && env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/katana.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/katana.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/katana.p12" -P "$PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
          echo "KATANA_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Package
        run: cmake --build build/${{ matrix.preset }} --target package
      # Apple's notary service checks the signed disk image and everything
      # in it, and the ticket it issues is stapled to the image, so
      # Gatekeeper opens Katana without a warning, even offline. APPLE_ID,
      # APPLE_APP_PASSWORD (an app-specific password) and APPLE_TEAM_ID.
      - name: Notarise
        if: runner.os == 'macOS' && env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="build/${{ matrix.preset }}/Katana-${{ needs.version.outputs.version }}-${{ matrix.package }}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
      # The tarball or disk image is what a user downloads, so it is tested
      # with the toolchain prefix moved out of reach: anything the package
      # failed to carry fails to load here rather than on the user's machine.
      # The disk image is mounted and Katana.app dragged out of it, as a user
      # installs it, and the app's seal is checked before it runs.
      # macOS has no timeout(1); the step's own limit stands in for it, so a
      # window that waits on a dialog fails the job instead of holding it.
      #
      # The Linux tarball is also what an update is made from, so the
      # producer and the independent recheck run on it here, unsigned and
      # into a scratch folder, before any program has run in the tree (see
      # the Windows job). The disk image gets no such run: its manifest only
      # announces a release and lists no file.
      #
      # Then the updater: the helper (Linux; the bundle carries none) must
      # start, verify a known signature and hold real keys, and the command
      # line must know which release it is.
      - name: Smoke test the package
        timeout-minutes: 20
        run: |
          set -eux
          # said <file> <word>: what a program printed holds exactly that
          # word, between white space.
          said() {
            tr -s ' \t\r' '\n' < "$1" > "$1.words"
            grep -qxF -- "$2" "$1.words" || { echo "::error::$1 does not say $2"; return 1; }
          }
          version="${{ needs.version.outputs.version }}"
          package="Katana-$version-${{ matrix.package }}"
          rm -rf smoke && mkdir smoke
          if [ "${{ matrix.archive }}" = dmg ]; then
            volume="$RUNNER_TEMP/katana-volume"
            hdiutil attach -nobrowse -readonly -mountpoint "$volume" "build/${{ matrix.preset }}/$package.dmg"
            test -L "$volume/Applications"
            ditto "$volume/Katana.app" smoke/Katana.app
            hdiutil detach "$volume"
            plutil -lint smoke/Katana.app/Contents/Info.plist
            test -s smoke/Katana.app/Contents/Resources/katana.icns
            codesign --verify --deep --strict --verbose=2 smoke/Katana.app
            bin="smoke/Katana.app/Contents/MacOS"
          else
            tar -xzf "build/${{ matrix.preset }}/$package.tar.gz" -C smoke
            bin="smoke/$package/bin"
            python3 tools/update_make_manifest.py --tree "smoke/$package" --out smoke/update \
              --version "$version" --target "${{ matrix.package }}" --sequence 1 \
              --seed "$UPDATE_SEED" --exclude "$UPDATE_EXCLUDE" --exclude "$UPDATE_EXCLUDE_LINUX"
            python3 tools/update_verify_release.py smoke/update --allow-unsigned --targets "${{ matrix.package }}"
          fi
          cp -r samples/site_plan smoke/project
          mv "$KATANA_TOOLCHAIN" "$KATANA_TOOLCHAIN.away"
          trap 'mv "$KATANA_TOOLCHAIN.away" "$KATANA_TOOLCHAIN"' EXIT
          "$bin/katana_cli" -c "RECT 0,0 30,20" -c "SAVE smoke/rect.katana"
          test -f smoke/rect.katana/project.db
          # GDAL, with PROJ's database found beside the bundled libproj: the
          # coordinate system is named from proj.db, which nothing else has.
          "$bin/katana_cli" -c "INFO samples/gis/terrain.asc" | tee smoke/info.txt
          grep -q "EPSG:32630" smoke/info.txt
          # PDAL and GDAL's vector drivers.
          "$bin/katana_cli" -c "IMPORT samples/gis/survey_scan.las" -c "IMPORT samples/gis/parcels.geojson"
          if [ "${{ matrix.archive }}" != dmg ]; then
            "$bin/katana_updater" --selftest > smoke/selftest.txt || { cat smoke/selftest.txt; exit 1; }
            cat smoke/selftest.txt
            said smoke/selftest.txt "selftest=ok"
            said smoke/selftest.txt "keys=pinned"
          fi
          "$bin/katana_cli" -c "UPDATE STATUS" > smoke/status.txt || { cat smoke/status.txt; exit 1; }
          cat smoke/status.txt
          said smoke/status.txt "installed=$version"
          said smoke/status.txt "target=${{ matrix.package }}"
          said smoke/status.txt "kind=archive"
          QT_QPA_PLATFORM=offscreen "$bin/katana" smoke/project --screenshot smoke/window.png
          test -s smoke/window.png
      # What the window drew, to look at; not part of the release.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.package }}
          path: smoke/window.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: katana-${{ matrix.package }}
          path: build/${{ matrix.preset }}/Katana-*-${{ matrix.package }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, windows, unix]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    # The update signing key is a secret of this environment: no other job
    # can read it, and this one only once the reviewers the environment
    # names have approved the run (docs/release.md, "Update signing").
    environment: release
    permissions:
      contents: write
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN != '' }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PUBLISH_REPO: ${{ needs.version.outputs.repo }}
      # The run's one sequence for its update manifests, read by the Version
      # job before anything was built.
      SEQUENCE: ${{ needs.version.outputs.sequence }}
      # The packages an update can be applied to file by file. macOS is not
      # one: a file changed inside Katana.app breaks the bundle's seal, so
      # its manifest only announces the release.
      TARGETS: win64 win-arm64 linux-x86_64 linux-aarch64
    steps:
      # Publishing in another repository needs a token that may write there;
      # the run's own cannot. The Version job asked for it before anything
      # was built. Asked again here, where it is used: this job may run long
      # after that one (it waits for an approval, and it can be run again by
      # itself), and without the secret the Release step would go to the
      # other repository with this run's own token.
      - name: Where the release goes
        if: needs.version.outputs.elsewhere == 'true' && env.HAS_RELEASES_TOKEN != 'true'
        run: |
          echo "::error::publish_repo names $PUBLISH_REPO, but the secret RELEASES_REPO_TOKEN (a token that may write that repository's releases) is not set"
          exit 1
      # tools/ and cmake/KatanaUpdateKeys.cmake: the producer, the recheck
      # and the keys a signature must be made with.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: katana-*
          path: dist
          merge-multiple: true
      # The update assets (docs/release.md, "Update assets"), made from the
      # packages themselves, unpacked: for each target a manifest of every
      # install file's SHA-256, a zip an installed copy fetches single files
      # out of, and the manifest's signature. Their names start Katana-, so
      # the checksums and the OpenPGP signatures below take them as they take
      # the packages.
      #
      # sign=ci (the default) signs here. Without the secret there is nothing
      # to sign with: no update asset is made, the run says so, and the
      # release is published as it was before there was an updater.
      # sign=offline makes the manifests and zips and no signature; the
      # release then stays a draft until the owner has signed it.
      - name: Update assets
        id: update
        env:
          SIGN: ${{ inputs.sign }}
          UPDATE_SIGNING_KEY: ${{ inputs.sign != 'offline' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          mode=none
          if [ "$SIGN" = offline ]; then
            mode=offline
          elif [ -n "${UPDATE_SIGNING_KEY:-}" ]; then
            mode=signed
          else
            echo "::warning title=No update assets::The secret UPDATE_SIGNING_KEY is not set (environment release), so $TAG is published without update manifests: installed copies are not told about it, and while it is the latest release they find no update information at all. Add the secret and run this job again (docs/release.md, Update signing)."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = none ]; then
            exit 0
          fi

          # ONE sequence for every target, and the run's own: the Version job
          # read it once, before anything was built. It is what orders two
          # builds of one version, so a whole new run outranks an earlier
          # one, while this job run again by itself publishes the same
          # packages under the same sequence and so offers them to no copy
          # that already has them. The recheck below refuses a release whose
          # manifests disagree on it.
          case "$SEQUENCE" in
            '' | *[!0-9]*)
              echo "::error::the Version job gave no sequence for the update manifests (got '$SEQUENCE')"
              exit 1
              ;;
          esac
          options=(--out dist --version "$VERSION" --tag "$TAG" --repo "$PUBLISH_REPO" --sequence "$SEQUENCE")
          if [ "$mode" = signed ]; then
            # The key as a file only the producer reads (it signs with the
            # openssl command line and refuses a key the tree does not pin),
            # for the length of this step and out of every child's
            # environment.
            key="$RUNNER_TEMP/update-signing.pem"
            trap 'rm -f "$key"' EXIT
            (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
            options+=(--key "$key")
          fi
          unset UPDATE_SIGNING_KEY

          for token in $TARGETS; do
            mkdir -p "trees/$token"
            case "$token" in
              win*)
                unzip -q "dist/Katana-$VERSION-$token.zip" -d "trees/$token"
                # A zip made on Windows carries the execute bits its archiver
                # guessed from the file names, and the producer, here on
                # Linux, would read them: as "exec" in the manifest and as a
                # reason to call a file in bin/ a program. Cleared, a Windows
                # file is classed by its name alone (.exe, .dll), as the
                # producer classes it on Windows, where there is no such bit.
                chmod -R u+rwX "trees/$token"
                find "trees/$token" -type f -exec chmod a-x {} +
                extra=()
                ;;
              *)
                tar -xzf "dist/Katana-$VERSION-$token.tar.gz" -C "trees/$token"
                extra=(--exclude "$UPDATE_EXCLUDE_LINUX")
                ;;
            esac
            tree="trees/$token/Katana-$VERSION-$token"
            # The manifest about to be made is offered to the installs whose
            # install.json names this target, so the package must be one.
            grep -qF "\"target\":\"$token\"" "$tree/share/katana/install.json" || {
              echo "::error::share/katana/install.json of the $token package does not name the target $token"
              exit 1
            }
            python3 tools/update_make_manifest.py --tree "$tree" --target "$token" "${options[@]}" \
              --seed "$UPDATE_SEED" --exclude "$UPDATE_EXCLUDE" "${extra[@]}"
          done
          python3 tools/update_make_manifest.py --target macos-arm64 --notify-only "${options[@]}"
          rm -rf trees

          # The independent recheck: nothing of the producer, every hash
          # recomputed from the zips and, when signed, every signature
          # verified against the keys the tree pins - the keys the programs
          # just built will verify with.
          targets="${TARGETS// /,},macos-arm64"
          if [ "$mode" = signed ]; then
            python3 tools/update_verify_release.py dist --keys-cmake cmake/KatanaUpdateKeys.cmake --targets "$targets"
          else
            python3 tools/update_verify_release.py dist --allow-unsigned --targets "$targets"
          fi
      - name: Checksums
        working-directory: dist
        run: sha256sum Katana-* | tee SHA256SUMS.txt
      # Every file signed with the publisher's OpenPGP key, when the
      # repository holds it (GPG_PRIVATE_KEY, armoured, and GPG_PASSPHRASE):
      # a .asc beside each, checked with `gpg --verify` (docs/release.md).
      - name: OpenPGP signatures
        if: env.HAS_GPG_KEY == 'true'
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in Katana-* SHA256SUMS.txt; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign "$file"
          done
          gpg --armor --export > katana-signing-key.asc
      # ONE call creates the release with every file, the update assets
      # among them: gh creates it as a draft, uploads, and only then
      # publishes, so the release an installed copy finds as `latest` is
      # never one whose manifests are still on their way. --latest is said,
      # not left to GitHub's guess from dates: `latest` is the feed.
      #
      # A release that already exists (a re-run) gets its files replaced,
      # the update zips first and the manifests last, loses any file this
      # run did not make, and is marked latest again. During the upload an
      # installed copy may meet a manifest and a signature of two different
      # runs; it then verifies nothing and offers nothing, and finds the
      # release whole at its next check.
      - name: Release
        env:
          GH_TOKEN: ${{ needs.version.outputs.elsewhere == 'true' && secrets.RELEASES_REPO_TOKEN || github.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          ELSEWHERE: ${{ needs.version.outputs.elsewhere }}
          MODE: ${{ steps.update.outputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            signed | offline | none) ;;
            *) echo "::error::the Update assets step did not say what it made"; exit 1 ;;
          esac
          if [ "$ELSEWHERE" = true ]; then
            # Another repository has no commit of this one to tag: gh tags
            # its default branch, and there is no history to write notes from.
            notes=(--notes "Katana $VERSION")
          else
            notes=(--target "$GITHUB_SHA" --generate-notes)
          fi
          if [ "$MODE" = offline ]; then
            state=(--draft)
          else
            state=(--latest)
          fi

          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/draft" 2> /dev/null; then
            draft=$(cat "$RUNNER_TEMP/draft")
            gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/published"
            if [ "$MODE" = offline ] && [ "$draft" != true ]; then
              echo "::error::$TAG is already published. sign=offline would put unsigned manifests in place of the signed ones installed copies are reading; nothing was uploaded. Delete the release first if that is meant."
              exit 1
            fi
            if [ "$MODE" = none ] && grep -q '^Katana-update-' "$RUNNER_TEMP/published"; then
              echo "::error::$TAG already carries update assets, and this run has no key to make its own: the packages would be replaced and the manifests would go on describing the earlier build. Nothing was uploaded; set the secret UPDATE_SIGNING_KEY and run this job again."
              exit 1
            fi
            first=() signatures=() manifests=()
            for file in dist/*; do
              case "$file" in
                dist/Katana-update-*.json.sig) signatures+=("$file") ;;
                dist/Katana-update-*.json) manifests+=("$file") ;;
                *) first+=("$file") ;;
              esac
            done
            gh release upload "$TAG" "${first[@]}" --clobber
            if [ "${#signatures[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${signatures[@]}" --clobber
            fi
            if [ "${#manifests[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${manifests[@]}" --clobber
            fi
            # What an earlier run published and this one did not make: a
            # signature of a manifest that has just been replaced, say.
            while IFS= read -r name; do
              if [ -n "$name" ] && [ ! -e "dist/$name" ]; then
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done < "$RUNNER_TEMP/published"
            if [ "$MODE" != offline ]; then
              gh release edit "$TAG" --draft=false --latest
            fi
          else
            gh release create "$TAG" dist/* --title "Katana $VERSION" "${notes[@]}" "${state[@]}"
          fi
          if [ "$MODE" = offline ]; then
            echo "::notice title=A draft without update signatures::$TAG is a draft: its update manifests are not signed. To finish it, on the machine that holds the key: python tools/update_release_sign.py --repo $GH_REPO --tag $TAG --key update-signing.pem (docs/release.md, Update signing)."
          fi
