[package]
name = "katana_app"
description = "The app layer: the headless session that katana_cli and katana_mcp share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Step 3's round-trip gate (tests/round_trip.rs; docs/rust.md, "The order of the work") runs the
# Rust readers and writers of its formats from a command line beside the C++ katana_cli. There is
# no Rust katana_cli until step 6, so this program stands in for its IMPORT, EXPORT, OPEN, SAVE
# and SURVEY READ. It is a binary of THIS package because katana_app may use every layer it
# needs, which no crate of step 3 may (and a crate that is no layer is refused by
# tools/check_rust_layering.py), and because cargo hands an integration test the programs of its
# own package alone (CARGO_BIN_EXE_<name>). Never installed; step 6's katana_cli replaces it.
[[bin]]
name = "katana_corpus"
path = "src/bin/katana_corpus/main.rs"

[dependencies]
katana_archive12d.workspace = true
katana_cad.workspace = true
katana_commands.workspace = true
katana_core.workspace = true
katana_dxf.workspace = true
katana_entity.workspace = true
katana_geodesy.workspace = true
katana_geometry.workspace = true
katana_gis.workspace = true
katana_ifc.workspace = true
katana_interop.workspace = true
katana_math.workspace = true
katana_pointcloud.workspace = true
katana_render.workspace = true
katana_storage.workspace = true
katana_survey.workspace = true
katana_surveyio.workspace = true
katana_terrain.workspace = true
katana_update.workspace = true

[lints]
workspace = true
