[package]
name = "katana_app"
description = "The app layer: the headless session that katana_cli and katana_mcp share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Katana engine without a window (src/katana_app/main.cpp): named as the C++ program is, so
# that the cli gate swaps one path for the other (docs/rust.md, step 6).
[[bin]]
name = "katana_cli"
path = "src/bin/katana_cli/main.rs"

# The Katana engine as a Model Context Protocol server (src/katana_app/mcp_main.cpp), named as
# the C++ program is, so that the cli gate swaps one path for the other (docs/rust.md, step 6).
[[bin]]
name = "katana_mcp"
path = "src/bin/katana_mcp/main.rs"

[dependencies]
katana_archive12d.workspace = true
katana_cad.workspace = true
katana_commands.workspace = true
katana_core.workspace = true
katana_dxf.workspace = true
katana_entity.workspace = true
katana_geodesy.workspace = true
katana_geometry.workspace = true
katana_gis.workspace = true
katana_ifc.workspace = true
katana_interop.workspace = true
katana_math.workspace = true
katana_pointcloud.workspace = true
katana_render.workspace = true
katana_storage.workspace = true
katana_survey.workspace = true
katana_surveyio.workspace = true
katana_terrain.workspace = true
katana_update.workspace = true

# katana_cli's console on Windows: the output code page set to UTF-8 for the run, and a console's
# lines read wide (src/bin/katana_cli/main.rs). The version katana_update already locks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
