[package]
name = "katana_update"
description = "The update layer: the auto-update engine: feed, signed manifest, plan, journal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
katana_core.workspace = true
# zlib's raw inflate in the C++ (src/katana_update/inflate.cpp; docs/rust.md, "Third-party
# libraries").
miniz_oxide = "0.8"
# OpenSSL's Ed25519 verification in the C++ (src/katana_update/signature.cpp): verify_strict, and
# the RFC 8032 checks the C++ makes on OpenSSL's big numbers (point decoding, the prime-order
# subgroup, S < L) on curve25519-dalek's points.
ed25519-dalek = "2"
curve25519-dalek = "4"

# The machine seams on Windows: the file system, the launcher, the Credential Manager, the
# command line, the process scan and the registry (fsops_win.rs, spawn_win.rs, credential_win.rs,
# process.rs, process_scan_win.rs, registry_win.rs). The tests use the same crate to read and
# write the Credential Manager behind the store's back, and for the free space of a volume.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
