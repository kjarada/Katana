[package]
name = "katana_update"
description = "The update layer: the auto-update engine: feed, signed manifest, plan, journal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
katana_core.workspace = true
# zlib's raw inflate in the C++ (src/katana_update/inflate.cpp; docs/rust.md, "Third-party
# libraries").
miniz_oxide = "0.8"
# nlohmann::json's twin, to parse only (docs/rust.md, "Third-party libraries"): serde_json reads
# the text and the private json module builds nlohmann's value from it with serde's Visitor
# traits (src/json.rs), so that a member written twice, a deep nesting, `-0` and a byte-order mark
# mean what they mean to the C++. float_roundtrip as the entity layer has it.
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
# OpenSSL's Ed25519 verification in the C++ (src/katana_update/signature.cpp): verify_strict, and
# the RFC 8032 checks the C++ makes on OpenSSL's big numbers (point decoding, the prime-order
# subgroup, S < L) on curve25519-dalek's points.
ed25519-dalek = "2"
curve25519-dalek = "4"

# The machine seams on Windows: the file system, the launcher, the Credential Manager and the
# command line (fsops_win.rs, spawn_win.rs, credential_win.rs, process.rs). The tests use the
# same crate to read and write the Credential Manager behind the store's back.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
