# Which C++ test directories are ported, and the C++ cases that have no Rust
# twin and why (tools/check_rust_parity.py, the `rust_parity` test;
# docs/rust.md, "Tests are the specification").
#
# A directory goes into `ported` in the commit that ports its last case; from
# then on every case there - a new one too, from a fix made in C++ - needs its
# twin, or the test fails.
ported = ["core", "math", "geometry", "geodesy", "render", "entity", "commands", "terrain", "survey", "storage", "dxf", "ifc", "surveyio", "update", "cad", "io", "interop", "app", "geo"]

[exempt]
# "Suite.CaseName" = "why it has no Rust twin"
# A Rust value cannot be used after it is moved, so there is no moved-from
# transformer to ask; the C++ case tests a state Rust cannot reach.
"GeodesyTransformer.MovedFromTransformerReportsInvalidState" = "a moved-from value cannot be used in Rust"
# The model holds validated UTF-8 (String) by the rule "bytes up to the
# decoder" (docs/rust.md, step 2): a writer has no invalid text to refuse.
"EntitySerialization.WritersReportFailureInsteadOfThrowing" = "a String cannot hold invalid UTF-8, so the writers have nothing to fail on"
"TableValidation.AStyleWhoseLinetypeNameIsNotUtf8IsRefused" = "a String cannot hold invalid UTF-8, so no such style can be made"
"CustomisationWriter.TextThatIsNotUtf8IsRefusedNamingWhereItIs" = "a String cannot hold invalid UTF-8, so the writer has no such text to refuse"
# cad (step 4): each case's only subject is a byte that is not UTF-8 in text
# a String holds - a tool's typed text, a leader report's name, the current
# layer's name - which Rust cannot hold, so there is nothing to refuse or
# replace. Cases with a UTF-8 half twin that half instead.
"AnnotateAlignedDimension.TextThatIsNotUtf8IsRefusedAtTheTextPrompt" = "a tool's typed text is a &str, so text that is not UTF-8 cannot reach the prompt to be refused"
"LeaderScope.AByteThatIsNotUtf8InAnyNameIsWrittenAsTheReplacementCharacterNotThrown" = "a leader report's names are Strings, which cannot hold a byte that is not UTF-8"
"DocumentStatus.ANameThatIsNotUtf8IsReplacedRatherThanThrown" = "the status's layer name is a String, which cannot hold a byte that is not UTF-8"
# step 5 (tests/geo, held as ported after step 6): the surface store's text
# is String, so these refusals cannot be reached; the case of a name that is
# not UTF-8 is twinned through the store's own byte check.
"SurfaceStore.ASourceOrAStyleThatIsNotUtf8IsRefused" = "a surface's source and style are Strings, which cannot hold a byte that is not UTF-8"
"SurfaceStore.ARenameToANameThatIsNotUtf8IsRefusedAndKeepsTheOldName" = "rename takes a &str, so a name that is not UTF-8 cannot reach it to be refused"
# Rust has no way to change the floating-point rounding mode (doing so is
# undefined behaviour), and f64::round rounds half away from zero in every mode.
"DimensionText.TheTieDirectionSurvivesAChangeOfRoundingMode" = "Rust cannot change the rounding mode; f64::round is half away from zero regardless"
# Step 7, the window (step7_plan.md section 3.3). ScreenFit read a Qt dialog's retained
# layout to find its footer and wrapped the dialog, once, from an application-wide event
# filter; an egui dialog declares its footer and is fitted every frame, so what these test
# - the layout read, the filter, a dialog shown again, Qt's own dialogs - is not there.
"ScreenFit.QtsOwnDialogsKeepTheirLayoutsToThemselves" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.FittingWithoutTheFilterDoesTheSameAsTheFilterDoes" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.ADialogShownAgainIsNotWrappedAgain" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.ADialogShownAgainKeepsOneFooter" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.OnlyTheLastRowOfButtonsIsTheFooterAndAnEarlierOneScrollsWithTheBody" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.AReadOnlyLineBesideTheButtonsIsPartOfTheirRow" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.ADialogWithNoRowOfButtonsHasNoFooterAndEverythingScrolls" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.AButtonRowThatIsNotLastAndIsFollowedByABigListIsNoFooter" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.ARowWithAFieldInItIsAFormsOwnAndNotTheFooter" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.ADialogLaidOutInAGridKeepsItsButtonsInTheScrollArea" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
"ScreenFit.ADialogThatFitsWithAButtonRowKeepsItsLayoutAndHasNoFooter" = "an egui dialog declares its footer and is fitted each frame; there is no Qt layout to read or wrap"
# The GPU layer on wgpu (step 7): no geometry stage, no serialized shader blobs, and one
# shader compiler (naga), where QRhi had a geometry-shader path, QShader blobs and two.
"GpuRender.TheGeometryShaderAndInstancingDrawTheSameLinesPointsAndCloud" = "wgpu has no geometry stage; lines and points are instanced only"
"GpuRender.SerializedShadersDrawWhatTheRuntimeShadersDraw" = "wgpu takes WGSL at run time; there are no serialized shaders to compare"
"SerializedShaderLibrary.ReportsABlobThatDoesNotDeserialize" = "there is no serialized shader library: the WGSL is compiled by naga at run time"
"GpuRender.BytecodeCompiledHereDrawsWhatQRhiCompilingTheSourceDraws" = "naga is the one shader compiler; there is no second to compare with"
